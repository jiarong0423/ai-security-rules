[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-security-rules"
version = "0.4.0"
description = "Read-only local scanner and gate for AI coding security risks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "ai-security-rules contributors" }
]
keywords = [
  "security",
  "ai-coding",
  "agent",
  "mcp",
  "secrets",
  "supply-chain"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.scripts]
ai-security-rules = "ai_security_rules.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_security_rules"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_security_rules/rules/security_design_gate_rules.json" = "ai_security_rules/rules/security_design_gate_rules.json"
