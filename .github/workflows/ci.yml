name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests
      - name: Validate bundled rules
        run: python3 -m json.tool src/ai_security_rules/rules/security_design_gate_rules.json
      - name: Validate tuning example
        run: python3 -m json.tool ai-security-rules-tuning.example.json
