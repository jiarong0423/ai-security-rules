repos:
  - repo: local
    hooks:
      - id: ai-security-rules-pre-design
        name: ai-security-rules pre-design gate
        entry: python3 -m ai_security_rules pre-design . --output-dir reports/ai-security-rules
        language: system
        pass_filenames: false
      - id: ai-security-rules-rules-check
        name: ai-security-rules full rules gate
        entry: python3 -m ai_security_rules rules-check . --output-dir reports/ai-security-rules
        language: system
        pass_filenames: false
